<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Bisection Method Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <!-- Animate.css for animations -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/static/styles.css">
  <!-- MathJax for rendering math formulas -->
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
  </script>
</head>

<body class="container mt-5">
  <h1 class="mb-4 animate__animated animate__fadeInDown text-center text-primary">Bisection Method Calculator</h1>

  {% if error %}
  <div class="alert alert-danger animate__animated animate__fadeInUp">{{ error }}</div>
  {% endif %}

  <form method="POST" action="/" class="animate__animated animate__fadeInUp" onsubmit="return validateForm()">
    <div class="form-group">
      <label for="function"><strong>Enter function \( f(x) \):</strong></label>
      <div class="d-flex">
        <input type="text" name="function" id="function" class="form-control" placeholder="e.g. x^3 - 4x - 9" required>
        <select id="functionDropdown" class="form-control ml-2" onchange="insertFunction()">
          <option value="">Sample functions</option>
          <option value="x^3 - 4*x - 9">x³ - 4x - 9</option>
          <option value="x^2 - 4*x + 4">x² - 4x + 4</option>
          <option value="sin(x) - x/2">sin(x) - x/2</option>
          <option value="exp(x) - 3*x">exp(x) - 3x</option>
        </select>
      </div>
      <small class="form-text text-muted">
        Example: <code>x^3 - 4x - 9</code>, <code>sin(x)</code>, <code>log(x)</code>, <code>exp(x)</code>.
      </small>
    </div>

    <div class="form-group">
      <label for="a"><strong>Enter interval start (a):</strong></label>
      <input type="text" name="a" id="a" class="form-control" placeholder="e.g. 1" required>
    </div>

    <div class="form-group">
      <label for="b"><strong>Enter interval end (b):</strong></label>
      <input type="text" name="b" id="b" class="form-control" placeholder="e.g. 3" required>
    </div>

    <div class="form-group">
      <label for="epsilon"><strong>Enter tolerance (epsilon, optional):</strong></label>
      <input type="text" name="epsilon" id="epsilon" class="form-control" placeholder="e.g. 0.001">
    </div>

    <button type="submit" class="btn btn-primary btn-block" id="submitButton">
      Calculate
      <span id="spinner" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"
        style="display:none;"></span>
    </button>
  </form>

  <script>
    // Function to insert selected function into the input field
    function insertFunction() {
      var dropdown = document.getElementById("functionDropdown");
      var functionInput = document.getElementById("function");
      var selectedFunction = dropdown.value;

      if (selectedFunction) {
        functionInput.value = selectedFunction;
      }
    }

    // Show spinner on submit
    document.querySelector("form").onsubmit = function () {
      document.getElementById("spinner").style.display = "inline-block";
      document.getElementById("submitButton").disabled = true;
    };
  </script>

</body>

</html>
